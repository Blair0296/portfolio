<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ZY 工业设计作品集</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
            background-color: #f5f5f5;
            color: #333;
        }
        header {
            text-align: center;
            padding: 24px 16px;
            background: #ffffff;
            box-shadow: 0 2px 8px rgba(0,0,0,0.08);
        }
        h1 {
            font-size: 24px;
            font-weight: 600;
            color: #111;
        }
        .pdf-container {
            width: 96%;
            max-width: 1200px;
            margin: 24px auto;
            height: calc(100vh - 150px);
            background: #ffffff;
            border-radius: 8px;
            overflow: hidden;
            box-shadow: 0 4px 16px rgba(0,0,0,0.1);
        }
        iframe {
            width: 100%;
            height: 100%;
            border: none;
        }
        @media (max-width: 768px) {
            header {
                padding: 16px;
            }
            h1 {
                font-size: 18px;
            }
            .pdf-container {
                width: 100%;
                margin: 12px auto;
                height: calc(100vh - 120px);
                border-radius: 0;
            }
        }
    </style>
</head>
<body>
    <header>
        <h1>ZY 工业设计作品集</h1>
    </header>
    <div class="pdf-container">
        <!-- 这里的文件名已经和你的 PDF 完全对应 -->
        <iframe src="zy_portfolio.pdf" width="100%" height="100%" frameborder="0"></iframe>
    </div>
</body>
</html>
